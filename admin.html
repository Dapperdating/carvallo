<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Carvallo Motors</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260616-perf">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script defer src="admin.js"></script>
  </head>
  <body class="admin-page">
    <header class="site-header compact">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logos/carvallo-motors-logo.png" alt="Carvallo Motors">
      </a>
      <a class="button ghost" href="index.html">Sito</a>
    </header>
    <main class="admin-shell">
      <section class="admin-intro">
        <p class="eyebrow">Catalogo</p>
        <h1>Carica una vettura</h1>
        <p>Accedi con email e password. Il pannello si sblocca solo per main@carvallo-motors.com.</p>
      </section>

      <section class="admin-login" id="login-panel">
        <div class="form-grid">
          <label>Email<input id="login-email" type="email" autocomplete="username" value="main@carvallo-motors.com" readonly></label>
          <label>Password<input id="login-password" type="password" autocomplete="current-password"></label>
        </div>
        <div class="admin-actions">
          <button class="button primary" id="login-button" type="button">Accedi</button>
          <button class="button ghost" id="signup-button" type="button">Crea password</button>
        </div>
        <button class="button ghost" id="logout-button" type="button" hidden>Esci</button>
        <p class="form-status" id="login-status">Sessione salvata su questo browser dopo il primo accesso.</p>
      </section>

      <form class="admin-form is-locked" id="car-form" hidden>
        <div class="form-grid">
          <label>Divisione
            <select name="division">
              <option value="motors">Motors</option>
              <option value="selected">Selected</option>
            </select>
          </label>
          <label>Stato
            <select name="status">
              <option value="available">Disponibile</option>
              <option value="incoming">In arrivo</option>
              <option value="sold">Venduta</option>
            </select>
          </label>
          <label>Marca<input name="make" required></label>
          <label>Modello<input name="model" required></label>
          <label>Anno<input name="year" type="number" min="1900" max="2100"></label>
          <label>Km<input name="mileage_km" type="number" min="0"></label>
          <label>Alimentazione<input name="fuel"></label>
          <label>Cambio<input name="transmission"></label>
          <label>Prezzo<input name="price_label" placeholder="€ 32.900 oppure Prezzo su richiesta"></label>
          <label>Slug<input name="slug" placeholder="bmw-m4-cs"></label>
        </div>
        <label>Immagini
          <input id="car-images" name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple>
        </label>
        <label>Immagine URL alternativa<input name="image_url" placeholder="https://..."></label>
        <label>Gallery URL manuali<textarea name="gallery_urls_raw" rows="4" placeholder="Una URL immagine per riga"></textarea></label>
        <label>Link origine annuncio<input name="source_url" placeholder="https://..."></label>
        <label>Descrizione breve<textarea name="short_description" rows="3"></textarea></label>
        <label>Descrizione completa<textarea name="description" rows="5"></textarea></label>
        <label class="checkbox"><input name="featured" type="checkbox"> In evidenza</label>
        <label class="checkbox"><input name="is_published" type="checkbox" checked> Pubblica subito</label>
        <button class="button primary" type="submit">Salva auto</button>
        <p class="form-status" id="admin-status"></p>
      </form>
    </main>
  </body>
</html>
